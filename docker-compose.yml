version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  request-service:
    build:
      context: ./TerminalManagementService
      dockerfile: src/RequestService/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TerminalConfiguration__PodName=request-local-1
      - TerminalConfiguration__RedisConnectionString=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  request-service-2:
    build:
      context: ./TerminalManagementService
      dockerfile: src/RequestService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TerminalConfiguration__PodName=request-local-2
      - TerminalConfiguration__RedisConnectionString=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  worker-service-1:
    build:
      context: ./TerminalManagementService
      dockerfile: src/WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TerminalConfiguration__PodName=worker-local-1
      - TerminalConfiguration__RedisConnectionString=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  worker-service-2:
    build:
      context: ./TerminalManagementService
      dockerfile: src/WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TerminalConfiguration__PodName=worker-local-2
      - TerminalConfiguration__RedisConnectionString=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  worker-service-3:
    build:
      context: ./TerminalManagementService
      dockerfile: src/WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TerminalConfiguration__PodName=worker-local-3
      - TerminalConfiguration__RedisConnectionString=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
